# Runs on every pull request and every push to main/staging.
name: Tests

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...
      # Deploy workflows never write a secret into a Deployment as a literal
      # env value (audit ST-N07).
      - run: bash scripts/ci/check_no_literal_secrets.sh
      # Postgres backup job: dumps every database, pg16 client, safe prune (AR-D04).
      - run: python3 -m unittest discover -s k8s/cluster/postgres-backup -v

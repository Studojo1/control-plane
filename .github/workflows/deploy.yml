name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: acrstudojo-dhfsdrfhf6a6bbg2.azurecr.io
  ACR_NAME: acrstudojo
  SERVICE_NAME: control-plane
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          TOKEN=$(az acr login --name ${{ env.ACR_NAME }} --expose-token --output tsv --query accessToken)
          docker login ${{ env.REGISTRY }} -u 00000000-0000-0000-0000-000000000000 -p "$TOKEN"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:buildcache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} \
            --name ${{ secrets.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Ensure emailer internal secret
        run: |
          # Injected on every proxied emailer call so the emailer's gated routes
          # accept this trusted gateway. Must match the emailer's INTERNAL_SECRET
          # (same EMAILER_INTERNAL_SECRET GitHub secret). No-op when unchanged.
          kubectl set env deployment/${{ env.SERVICE_NAME }} -n studojo \
            EMAILER_INTERNAL_SECRET="${{ secrets.EMAILER_INTERNAL_SECRET }}"

      - name: Rate limiter settings (shadow mode)
        run: |
          # control-plane's rate limiter needs Redis; REDIS_URL was never set, so
          # it silently ran disabled. The redis-url secret has no password (Redis
          # runs with --requirepass), so REDIS_PASSWORD is wired separately.
          # RATE_LIMIT_MODE=shadow logs would-be blocks without rejecting anyone;
          # switch to "enforce" only after reviewing those logs.
          cat > /tmp/rl-env.json <<PATCH
          {"spec":{"template":{"spec":{"containers":[{"name":"control-plane","env":[
            {"name":"REDIS_URL","valueFrom":{"secretKeyRef":{"name":"app-secrets","key":"redis-url"}}},
            {"name":"REDIS_PASSWORD","valueFrom":{"secretKeyRef":{"name":"app-secrets","key":"redis-password"}}},
            {"name":"RATE_LIMIT_MODE","value":"shadow"},
            {"name":"RATE_LIMIT_PREFIX","value":"ratelimit"}
          ]}]}}}}
          PATCH
          kubectl patch deployment/control-plane -n studojo --type=strategic --patch-file=/tmp/rl-env.json

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/${{ env.SERVICE_NAME }} ${{ env.SERVICE_NAME }}=${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }} -n studojo
          kubectl rollout status deployment/${{ env.SERVICE_NAME }} -n studojo --timeout=10m || {
            echo "Rollout failed or timed out. Checking pod status..."
            kubectl get pods -n studojo -l app=${{ env.SERVICE_NAME }} -o wide
            echo ""
            echo "Recent pod events:"
            LATEST_POD=$(kubectl get pods -n studojo -l app=${{ env.SERVICE_NAME }} --sort-by=.metadata.creationTimestamp -o jsonpath='{{.items[-1].metadata.name}}' 2>/dev/null || echo "")
            if [ -n "$LATEST_POD" ]; then
              kubectl get events -n studojo --field-selector involvedObject.name=$LATEST_POD --sort-by='.lastTimestamp' | tail -20 || true
              echo ""
              echo "Pod logs:"
              kubectl logs -n studojo $LATEST_POD --tail=50 || true
            fi
            exit 1
          }

      - name: Record deployment
        run: |
          curl -X POST https://api.studojo.com/v1/dev/deployments \
            -H "Content-Type: application/json" \
            -H "X-Deployment-Secret: ${{ secrets.DEPLOYMENT_SECRET }}" \
            -d '{
              "service": "${{ env.SERVICE_NAME }}",
              "version": "${{ env.IMAGE_TAG }}",
              "deployed_at": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'",
              "deployed_by": "${{ github.actor }}",
              "status": "success",
              "workflow_run": ${{ github.run_id }}
            }' || echo "Failed to record deployment (non-critical)"

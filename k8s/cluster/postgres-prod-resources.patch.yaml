# Prod Postgres (studojo/postgres, pod postgres-0) memory request (audit IN-N05).
#
# postgres-0 requests 512Mi but uses about 2.9Gi, so the scheduler packs other
# pods onto its node (97% memory on 30 Sep) and a burst there can OOM-kill the
# primary DB. Raise the request to what it actually uses, with headroom on the limit.
#
# APPLIED 2026-10-01 in the AKS maintenance window (postgres-0 restarted once).
# The live StatefulSet also loads pg_stat_statements (track=top) for query
# statistics; the args below are the full live list, because a strategic merge
# replaces the whole args array. To re-apply:
#
#   kubectl get sts postgres -n studojo -o yaml > postgres-sts-backup.yaml
#   kubectl patch sts postgres -n studojo --type=strategic \
#     --patch-file k8s/cluster/postgres-prod-resources.patch.yaml
#   kubectl rollout status sts/postgres -n studojo --timeout=10m
#
# With a 3Gi request, postgres-0 will not fit back on its current node: that
# node already has about 3.4Gi requested by other pods, and nodes allocate
# about 5.6Gi. The scheduler will pick another node, and the cluster autoscaler
# (nodepool1, 4-12 nodes) adds one if none fits. The disk is not zonal, so it
# can move. Expect up to a few minutes if a node must be added.
# Rollback: kubectl apply -f postgres-sts-backup.yaml (also a restart).
spec:
  template:
    spec:
      containers:
        - name: postgres
          args:
            - "-c"
            - "max_connections=300"
            - "-c"
            - "shared_buffers=512MB"
            - "-c"
            - "superuser_reserved_connections=5"
            - "-c"
            - "shared_preload_libraries=pg_stat_statements"
            - "-c"
            - "pg_stat_statements.track=top"
          resources:
            requests:
              cpu: 250m
              memory: 3Gi
            limits:
              cpu: "2"
              memory: 6Gi
